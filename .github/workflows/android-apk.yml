# Builds an installable Android test APK on every push to main
# and publishes it on the repo's Releases page.
#
# The APK is for testing on your own phone. For Google Play, use the
# EAS production build described in PUBLISHING.md (it makes a signed .aab).

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Test APKs can unlock premium themes for free (no store keys yet).
      EXPO_PUBLIC_ALLOW_TEST_UNLOCK: '1'
      NODE_ENV: production
      # Real phones (arm) plus x86_64 so the emulator test can run it.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a,x86_64
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Check Android SDK
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
            java -version
            node -v
          } 2>&1 | tee -a build.log

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a build.log

      - name: Generate Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee -a build.log

      - name: Build APK
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../build.log

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="DiceRoller-v${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          # Same file under a fixed name, so .../releases/latest/download/DiceRoller.apk
          # always gets the newest build.
          cp "$NAME" DiceRoller.apk
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.name }}

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test build ${{ github.run_number }} (v${{ steps.apk.outputs.version }})
          prerelease: false
          make_latest: true
          files: |
            ${{ steps.apk.outputs.name }}
            DiceRoller.apk
          body: |
            Android test APK built from ${{ github.sha }}.

            **Install:** open this page on your Android phone, tap the `.apk` file to download,
            then open it. Allow "Install unknown apps" for your browser if asked.

            Premium themes unlock for free in this test build.

      - name: Remove older test builds (keep the newest 2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "${{ github.repository }}" --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("test-build-"))) | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag -y -R "${{ github.repository }}" || true
          done

      # On failure, surface the end of the log as a readable annotation.
      - name: Report failure
        if: failure()
        run: |
          touch build.log
          grep -iE "error|failed|what went wrong|exception|could not" build.log | tail -n 40 > errors.txt || true
          tail -n 40 build.log > tail.txt
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' "$1" | awk 'BEGIN{ORS="%0A"}{print}' | cut -c1-30000; }
          echo "::error title=Build errors::$(enc errors.txt)"
          echo "::error title=Build log tail::$(enc tail.txt)"

  # Opens the APK on an Android emulator and reports whether it starts.
  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34, 35]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke-test.sh "$(ls apk/*.apk | head -n 1)"

      - name: Report result
        if: always()
        run: |
          touch pid.txt pid2.txt logcat.txt logcat2.txt install.txt
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}' | cut -c1-30000; }
          echo "::notice title=Install::$(cat install.txt | enc)"
          echo "::notice title=API ${{ matrix.api-level }} app process after launch / after tap::$(cat pid.txt pid2.txt | enc)"
          grep -E "FATAL|AndroidRuntime|ReactNativeJS|E ReactNative|E/ReactNative|SoLoader|UnsatisfiedLink|Exception|libc |DEBUG   :|E/Expo|E/GL|EGL|crash" logcat2.txt | grep -v "^I/" | head -n 120 | enc > crash.txt
          echo "::warning title=Crash log::$(cat crash.txt)"
          grep -E "ReactNativeJS" logcat2.txt | tail -n 40 | enc > js.txt
          echo "::notice title=JS log::$(cat js.txt)"

      - name: Attach screenshot to the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s screen.png ]; then
            cp screen.png "emulator-api${{ matrix.api-level }}.png"
            cp logcat2.txt "logcat-api${{ matrix.api-level }}.txt"
            gh release upload "test-build-${{ github.run_number }}" "emulator-api${{ matrix.api-level }}.png" "logcat-api${{ matrix.api-level }}.txt" --clobber -R "${{ github.repository }}" || true
          fi

  # Signed Android App Bundle (.aab) for uploading to Google Play.
  # Needs the repository secret UPLOAD_KEYSTORE_PASSWORD (see PUBLISHING.md).
  play-bundle:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_ENV: production
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Check signing secret
        id: secret
        env:
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::warning title=Play bundle skipped::Add the UPLOAD_KEYSTORE_PASSWORD repository secret to build the Google Play .aab (see PUBLISHING.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secret.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        if: steps.secret.outputs.ok == 'true'
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        if: steps.secret.outputs.ok == 'true'
        run: npm ci

      - name: Set version code
        if: steps.secret.outputs.ok == 'true'
        id: ver
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          node -e "const f='app.json',a=require('./'+f);a.expo.android.versionCode=$CODE;require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Unlock upload key
        if: steps.secret.outputs.ok == 'true'
        env:
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/upload-keystore.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:PW

      - name: Generate Android project
        if: steps.secret.outputs.ok == 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Build signed bundle
        if: steps.secret.outputs.ok == 'true'
        working-directory: android
        env:
          UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: upload
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Check signature and attach to release
        if: steps.secret.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$AAB" | grep -m1 "CN=Host Ready LLC" \
            || { echo "::error::Bundle is not signed with the upload key"; exit 1; }
          NAME="DiceRoller-PlayStore-v${{ steps.ver.outputs.version }}-code${{ steps.ver.outputs.code }}.aab"
          cp "$AAB" "$NAME"
          gh release upload "test-build-${{ github.run_number }}" "$NAME" --clobber -R "${{ github.repository }}"
          echo "::notice title=Play bundle ready::$NAME (version code ${{ steps.ver.outputs.code }})"
